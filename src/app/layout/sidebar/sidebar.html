<aside class="fixed inset-y-0 left-0 z-20 w-rail p-6 compact:px-3 compact:py-4">
  <nav class="flex h-full flex-col items-center" aria-label="Navegación principal">
    <of-icon-button class="mb-2 [--of-icon-button-color:var(--of-primary)]" icon="brand" label="OpenF, opciones de cuenta" kind="navigation" size="lg" shape="circle" variant="secondary"
      popoverTarget="account-menu" [expanded]="menuOpen()" />
    <div class="flex flex-col items-center">
      @for (item of items; track item.path) {
        <of-icon-button [icon]="item.icon" [label]="item.label" kind="navigation"
          size="lg" shape="circle" variant="secondary" [active]="currentPath() === item.path" [current]="currentPath() === item.path"
          (pressed)="navigate(item.path)" />
      }
    </div>
    <of-icon-button class="mt-auto" icon="apps" label="Opciones de cuenta" kind="navigation" size="lg" shape="circle" variant="secondary"
      popoverTarget="account-menu" [expanded]="menuOpen()" />
  </nav>
</aside>
<of-popover popoverId="account-menu" label="Opciones de cuenta" (toggled)="menuOpen.set($event)">
  <h2 class="mx-2 mb-5 text-2xl leading-normal font-medium tracking-[-0.7px]">Opciones</h2>
  <div class="flex items-center gap-3 p-2">
    <span class="flex size-9 flex-none items-center justify-center rounded-full bg-surface-active"><of-icon name="user" /></span>
    <div class="flex min-w-0 flex-col gap-0.5">
      <strong class="overflow-hidden text-[13px] font-semibold text-ellipsis">{{ session.user()?.name }}</strong>
      <span class="truncate text-[11px] text-content-muted">{{ session.user()?.email }}</span>
    </div>
  </div>
  <div class="mx-2 mt-3 mb-2 h-px bg-outline-subtle"></div>
  <div class="px-2 py-3">
    <p class="mb-2 text-[11px] text-content-muted">Apariencia</p>
    <div role="group" aria-label="Tema" class="grid grid-cols-3 gap-1 rounded-control bg-surface-active p-1">
      @for (option of themes; track option.value) {
        <button ofButton="ghost" size="sm" type="button" toggle
          class="min-w-0 px-1 text-[11px]"
          [active]="theme() === option.value" (click)="setTheme(option.value)">
          {{ option.label }}
        </button>
      }
    </div>
  </div>
  <div class="mx-2 mt-1 mb-2 h-px bg-outline-subtle"></div>
  <button ofButton="ghost" icon="logout" type="button"
    class="flex min-h-12 w-full items-center justify-start gap-3 rounded-control border-0 bg-transparent p-3 text-left text-[13px] font-normal text-inherit focus-visible:outline-focus"
    [busy]="signingOut()" (click)="logout()">
    <span>{{ signingOut() ? 'Cerrando sesión…' : 'Cerrar sesión' }}</span>
  </button>
  @if (error()) { <p class="px-3 py-2 text-xs leading-normal text-danger" role="alert">{{ error() }}</p> }
</of-popover>
