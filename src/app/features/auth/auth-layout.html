<main class="grid min-h-dvh grid-rows-[auto_1fr] px-8 py-6 compact:px-6 compact:pb-5">
  <a class="inline-flex items-center justify-self-start gap-2.5 rounded-md text-[21px] leading-8 font-bold tracking-[-0.8px] no-underline" href="/login" aria-label="OpenF, ir al acceso">
    <of-brand-mark [compact]="true" /><span>OpenF</span>
  </a>
  <section class="mx-auto my-6 flex w-full max-w-[800px] items-center justify-center rounded-panel border border-outline-subtle p-10 compact:my-8 compact:min-h-0 compact:border-0 compact:px-0 compact:py-6" aria-labelledby="auth-title">
    <div class="w-full max-w-[400px]">
      <of-brand-mark class="mb-5" [tile]="true" />
      <h1 id="auth-title" class="text-[clamp(34px,4vw,44px)] leading-[1.12] font-semibold tracking-[-1.8px] text-content-strong compact:tracking-[-1.2px]">{{ title() }}</h1>
      <p class="mt-3 mb-8 text-sm leading-[22px] text-content-muted">{{ subtitle() }}</p>
      <ng-content />
    </div>
  </section>
</main>
